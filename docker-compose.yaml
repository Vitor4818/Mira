version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mira-postgres
    environment:
      POSTGRES_DB: mira_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_mira_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_mira_data: